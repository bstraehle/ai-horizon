<!doctype html><meta charset="utf-8" /><title>AI HORIZON icon concepts</title>
<style>
  body {
    margin: 0;
    padding: 24px;
    background: #1b1d22;
    color: #eee;
    font:
      14px/1.4 system-ui,
      sans-serif;
  }
  h1 {
    font-size: 18px;
    margin: 0 0 16px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 18px;
  }
  .label {
    width: 118px;
    font-weight: 600;
  }
  .tile {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 14px 18px;
    border-radius: 12px;
  }
  .col {
    display: flex;
    flex-direction: column;
    gap: 12px;
    align-items: center;
  }
  img {
    display: block;
  }
  .rounded {
    border-radius: 20%;
  }
  .circle {
    border-radius: 50%;
  }
  .safe {
    position: relative;
    width: 192px;
    height: 192px;
  }
  .zone {
    position: absolute;
    left: 17%;
    top: 17%;
    width: 66%;
    height: 66%;
    border: 2px dashed rgba(255, 92, 92, 0.85);
    border-radius: 50%;
    box-sizing: border-box;
  }
  .note {
    color: #aaa;
    margin-top: 8px;
  }
</style>
