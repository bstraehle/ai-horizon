# AI HORIZON production infrastructure, managed by the CloudFormation stack "ai-horizon" (us-west-2).
#
# Imported from the live resources (CloudFormation IaC generator + resource import), so the IDs are
# the real ones. Every resource is DeletionPolicy/UpdateReplacePolicy Retain: deleting the stack or
# replacing a resource never deletes production data.
#
# Not in this template, on purpose:
#   - Lambda code: deployed with update-function-code (AGENTS.md); CloudFormation owns the configuration.
#   - Secret values: set with put-secret-value from .secrets/ (gitignored); never in this file.
#   - The alerts e-mail subscription (a personal address) and the ACM certificate (us-east-1).
#   - The CloudFront function apex-to-www-redirect (global; referenced by ARN).
# See infra/README.md for how to change and deploy it.
